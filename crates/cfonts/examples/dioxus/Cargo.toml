[package]
name = "cfonts-example-dioxus"
version = "0.0.0"
edition = "2024"
publish = false

# Kept outside the root workspace so normal builds stay framework-free
[workspace]

[dependencies]
cfonts = {
	path = "../..",
	default-features = false,
	features = ["dioxus"],
}

# hooks hold the page state, mounted hands the controls over so the page can set their custom validity
dioxus = {
	version = "0.7",
	default-features = false,
	features = ["launch", "hooks", "mounted"],
}
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = {
	version = "0.3",
	features = ["Element", "Event", "HtmlInputElement", "HtmlSelectElement", "MediaQueryList", "Window", "console"],
}

[features]
default = ["web"]
web = ["dioxus/web"]
