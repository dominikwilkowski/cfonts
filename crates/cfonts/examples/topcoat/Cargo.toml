[package]
name = "cfonts-example-topcoat"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

# standalone on purpose: normal workspace builds stay topcoat-free
[workspace]

[[bin]]
name = "topcoat"
path = "topcoat.rs"

[dependencies]
cfonts = { path = "../..", default-features = false, features = ["web"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
topcoat = "0.10"
