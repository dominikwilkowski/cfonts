version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Brisbane
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "10:00"
      timezone: Australia/Brisbane

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "10:00"
      timezone: Australia/Brisbane
