name: Testing

defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - "released"
  pull_request:
    branches:
      - "released"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout files
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
          cache: true
          cache-targets: true
          cache-bin: false
          cache-on-failure: false
          cache-all-crates: false
          cache-workspace-crates: false
          cache-save-if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

      # - name: Tree files for debugging
      #   run: |
      #     sudo apt-get -y install tree && which tree
      #     tree -I "node_modules*|.git*"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Clippy
        run: cargo clippy --locked --workspace --all-features --tests --all-targets -- -D warnings

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout files
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.96.1
          cache: true
          cache-targets: true
          cache-bin: false
          cache-on-failure: false
          cache-all-crates: false
          cache-workspace-crates: false
          cache-save-if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Run build
        run: cargo build --workspace --all-targets --all-features --release --locked

      - name: Run cargo tests
        run: cargo test --workspace --all-targets --all-features --locked --no-fail-fast

      - name: Run cargo doc tests
        run: cargo test --doc --workspace --all-features --locked --no-fail-fast

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout files
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.96.1
          target: wasm32-unknown-unknown
          cache: true
          cache-targets: true
          cache-bin: false
          cache-on-failure: false
          cache-all-crates: false
          cache-workspace-crates: false
          cache-save-if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the package
        run: pnpm run build

      - name: Check formatting and linting
        run: pnpm run test:format && pnpm run test:lint

      - name: Check TypeScript and the consumer types
        run: pnpm run test:typecheck && pnpm run test:types

      - name: Run WASM tests
        run: pnpm run test:wasm

      - name: Install the playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run package tests
        run: pnpm run test:js && pnpm run test:browser

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout files
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.96.1
          components: llvm-tools-preview
          cache: true
          cache-targets: false
          cache-bin: false
          cache-on-failure: false
          cache-save-if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none
          checksum: true

      - name: Generate code coverage
        run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info

      - name: Print last few lines of lcov.info
        run: tail ./lcov.info

      - name: Upload to coveralls
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info
          format: lcov
          flag-name: rust
          coverage-reporter-version: v0.6.17
