name: Testing

defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - "released"
  pull_request:
    branches:
      - "released"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          components: rustfmt, clippy
          target: wasm32-unknown-unknown
          cache: true
          cache-workspaces: |
            . -> target
            crates/cfonts/examples/leptos -> target
            crates/cfonts/examples/dioxus -> target
          cache-targets: true
          cache-bin: false
          cache-on-failure: false
          cache-all-crates: false
          cache-workspace-crates: false
          cache-save-if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

      # - name: Tree files for debugging
      #   run: |
      #     sudo apt-get -y install tree && which tree
      #     tree -I "node_modules*|.git*"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Clippy
        run: cargo clippy --locked --workspace --all-features --tests --all-targets -- -D warnings

      - name: Check the release profile
        run: cargo check --locked --workspace --all-targets --all-features --release

      - name: Check each feature in isolation
        run: |
          cargo check --locked -p cfonts --features web
          cargo check --locked -p cfonts --features ratatui
          cargo check --locked -p cfonts --features leptos
          cargo check --locked -p cfonts --features dioxus
          cargo check --locked -p cfonts --features wasm

      - name: Check the framework examples
        run: make check

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
        toolchain:
          - msrv
          - stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the toolchain
        id: toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          if [ "$TOOLCHAIN" = "msrv" ]; then
            TOOLCHAIN=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cfonts") | .rust_version')
          fi
          echo "version=$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          target: wasm32-unknown-unknown
          cache: true
          cache-targets: true
          cache-bin: false
          cache-on-failure: false
          cache-all-crates: false
          cache-workspace-crates: false
          cache-save-if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Run cargo tests
        run: cargo test --workspace --all-targets --all-features --locked --no-fail-fast

      - name: Run cargo doc tests
        run: cargo test --doc --workspace --all-features --locked --no-fail-fast

      - name: Check the core WASM target
        run: cargo check --locked -p cfonts --lib --target wasm32-unknown-unknown --no-default-features

      - name: Check the ratatui feature on the WASM target
        run: cargo check --locked -p cfonts --lib --target wasm32-unknown-unknown --no-default-features --features ratatui

      - name: Check the web feature on the WASM target
        run: cargo check --locked -p cfonts --lib --target wasm32-unknown-unknown --no-default-features --features web

      - name: Check the leptos feature on the WASM target
        run: cargo check --locked -p cfonts --lib --target wasm32-unknown-unknown --no-default-features --features leptos

      - name: Check the dioxus feature on the WASM target
        run: cargo check --locked -p cfonts --lib --target wasm32-unknown-unknown --no-default-features --features dioxus

      - name: Check the wasm feature on the WASM target
        run: cargo check --locked -p cfonts --lib --target wasm32-unknown-unknown --no-default-features --features wasm

  package:
    name: Package
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          cache: true
          cache-workspaces: |
            . -> target
            crates/cfonts/examples/leptos -> target
            crates/cfonts/examples/dioxus -> target
          cache-targets: true
          cache-bin: false
          cache-on-failure: false
          cache-all-crates: false
          cache-workspace-crates: false
          cache-save-if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Install trunk
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: trunk@0.21.14
          fallback: none
          checksum: true

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.8.1"

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Check biome
        run: pnpm run test:biome

      - name: Check the packages carry license and readme
        run: |
          cargo package --list -p cfonts --allow-dirty | grep --line-regexp LICENSE
          cargo package --list -p cfonts --allow-dirty | grep --line-regexp README.md
          cargo package --list -p cfonts-macros --allow-dirty | grep --line-regexp LICENSE
          diff LICENSE crates/cfonts/LICENSE
          diff LICENSE crates/macros/LICENSE
          npm pack --dry-run --json | node -e "
          const [pack] = JSON.parse(require('fs').readFileSync(0, 'utf8'));
          const files = new Set(pack.files.map((file) => file.path));
          if (!files.has('LICENSE') || !files.has('README.md')) {
           	console.error('the npm package must carry LICENSE and README.md');
           	process.exit(1);
          }
          "

      - name: Check version parity
        run: |
          cargo_v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="cfonts") | .version')
          npm_v=$(node -p "require('./package.json').version")
          pin=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="cfonts") | .dependencies[] | select(.name=="cfonts-macros") | .req')
          test "$cargo_v" = "$npm_v" || { echo "crate $cargo_v != npm $npm_v"; exit 1; }
          test "$pin" = "=$cargo_v" || { echo "macros pin $pin != =$cargo_v"; exit 1; }

      - name: Run WASM tests
        run: pnpm run test:wasm

      - name: Build and test the package
        run: pnpm run test:package

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/released' && matrix.node == 24
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/browser-example

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          components: llvm-tools-preview
          cache: true
          cache-targets: false
          cache-bin: false
          cache-on-failure: false
          cache-save-if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
          checksum: true

      - name: Generate code coverage
        run: cargo llvm-cov --locked --all-features --workspace --lcov --exclude cfonts-wasm --output-path lcov.info

      - name: Print last few lines of lcov.info
        run: tail ./lcov.info

      - name: Upload to coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info
          format: lcov
          flag-name: rust
          coverage-reporter-version: v0.6.17

  deploy-pages:
    name: Deploy browser example
    if: github.event_name == 'push' && github.ref == 'refs/heads/released'
    needs: [lint, test, package, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy browser example
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
