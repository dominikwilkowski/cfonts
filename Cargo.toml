[workspace]
members = ["crates/cfonts", "crates/macros", "crates/wasm"]
default-members = ["crates/cfonts"]
resolver = "3"

[workspace.package]
version = "4.0.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["Dominik Wilkowski <Hi@Dominik-Wilkowski.com>"]
license = "GPL-3.0-or-later"
homepage = "https://github.com/dominikwilkowski/cfonts"
repository = "https://github.com/dominikwilkowski/cfonts"

[workspace.dependencies]
cfonts-macros = { path = "crates/macros", version = "=4.0.0" }

# The release build of the cfonts binary and the npm package
# fat link-time optimization keeps the default codegen units, a single unit renders gradients about 30% slower
[profile.release]
lto = "fat"
strip = true

# Stripping removes the section that records the wasm features the module uses, wasm-opt then rejects the module
[profile.release.package.cfonts-wasm]
strip = false
